name: demo
# Rebuilds the sample week from the seeded synthetic generator, runs the report on it and
# publishes the dashboard to GitHub Pages. No real data is involved at any step.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, so a broken pipeline shows up within a week

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Generate the synthetic weeks and run the report
        run: python -m benchmark.build_samples
      - name: Assemble the site
        run: python -m benchmark.build_site --out _site
      - name: Page title, description and share preview
        run: python3 demo/page_meta.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
